name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Make Gradle wrapper executable
        run: |
          sed -i -e 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Dump Logs on Failure
        if: failure()
        run: |
          mkdir -p debug-logs
          cp android/build.log debug-logs/error.txt || echo "No build.log found" > debug-logs/error.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-failure-log
          git add -f debug-logs/error.txt
          git commit -m "Auto-captured build failure log"
          git push origin build-failure-log --force

      - name: Collect APK
        run: |
          mkdir -p release-apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/palle-nestham.apk
          fi
          find . -name "*.apk" -exec cp {} release-apk/ \;
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palle-Nestham-debug-apk
          path: release-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Palle Nestham v1.0.0 (Android APK)"
          body: "Official Android APK for Palle Nestham (తండ్లం పంచాయతీ, తిరుపతి)."
          files: release-apk/*.apk
